<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=240, initial-scale=1, user-scalable=no">
<title>Skywave</title>
</head>
<body>
<div id="app">
  <canvas id="map"></canvas>
  <div id="ring"></div>
  <div id="status"></div>
  <div id="attr" hidden></div>
  <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
  <div id="lists"><button id="bnew" aria-label="New stations worldwide">★</button><button id="bfav" aria-label="My favourites">♥</button></div>
  <div id="tools">
    <button id="bfly" aria-label="Fly: the wheel moves between places" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" transform="rotate(45 12 12)" d="M12 2c.8 0 1.4.7 1.4 1.6V9l8.1 4.6v2.1l-8.1-2.4v5l2.3 1.7V22L12 21l-3.7 1V20l2.3-1.7v-5l-8.1 2.4v-2.1L10.6 9V3.6c0-.9.6-1.6 1.4-1.6z"/></svg></button>
    <button id="binfo" aria-label="About"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="7.6" r="1.3" fill="currentColor"/><path fill="currentColor" d="M10.9 10.4h2.2v7h-2.2z"/></svg></button>
  </div>
  <div id="vol" hidden><div class="row"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9h4l5-4v14l-5-4H3z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M15.5 8.5a5 5 0 0 1 0 7"/></svg><div class="bar"><div class="fill"></div></div><div class="pct"></div></div><div class="note"></div></div>
  <div id="strip"><div class="name"></div><div class="where"></div></div>
  <div id="list" hidden><div class="title"></div><div class="rows"></div><div class="hint"></div></div>
  <div id="about" hidden></div>
  <div id="gate"><button id="start">Tap to tune in</button><div class="hint"></div></div>
</div>
<script src="__APP_JS__"></script>
</body>
</html>
