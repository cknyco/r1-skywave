# Builds and deploys the site on every push to main, nightly at 03:17 UTC and on demand.
# Three jobs, each with only the permissions it needs:
#   build      (contents: read)  reads the previous snapshot and the day base from branch data-log
#              (read-only), builds the station data from Radio Browser keeping the stations the previous
#              snapshot had or recently lost (falls back to the dataset already live when that fails),
#              compares it with the day base to write data/new.json and the change log, builds and tests
#              the app, checks fresh data for white in a real browser (below), and uploads the Pages
#              artifact plus a data-log artifact.
#   deploy     (pages: write, id-token: write)  publishes the Pages artifact.
#   changelog  (contents: write)  commits snapshot.json, day-base.json and changes/ to branch data-log
#              (never main); runs only when the build deploys fresh data: not the live fallback, not
#              data the white check turned away. Its nightly pushes count as repository activity, so
#              GitHub keeps the schedule enabled.
# The white check (fresh data only, after the build and `pnpm test`): e2e/white.spec.ts alone, headless and
# muted in Playwright's Chromium, on the data just built (scripts/white-check.ts). A white pixel (smallest
# channel 215 or more) in any view means that data must not deploy: the build deploys the last live dataset
# instead, as when Radio Browser fails (a ::warning:: names the views and values), and the changelog job
# skips that night, so data-log records only deployed data. Without WebGL on the runner the WebGL views
# skip (::notice::) and the Canvas 2D views decide. When the check cannot run or decide (browser install,
# the check itself), the fresh data deploys unchecked with a ::warning::. The white model in `pnpm test`
# (tests/map/lightsdata.test.ts) is advisory: it warns, it never blocks.
name: pages
on:
  push:
    branches: [main]
  schedule: [{ cron: '17 3 * * *' }]
  workflow_dispatch:
permissions:
  contents: read
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # 'success' only when the build deploys fresh data: not the live fallback, not data the white check turned away.
      fresh: ${{ steps.white.outputs.verdict == 'white' && 'white' || steps.data.outcome }}
    steps:
      - uses: actions/checkout@v7
      - run: git fetch --depth=1 origin data-log:refs/remotes/origin/data-log || true
      # pnpm only (package.json devEngines): the version that wrote pnpm-lock.yaml and reads allowBuilds.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (third-party: pinned to a commit)
        with: { version: 11.5.2 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # GeoNames cities15000 (place names) and admin1CodesASCII (regions, Ruling 51), downloaded once.
      - uses: actions/cache@v6
        with: { path: .cache, key: geonames-cities15000-admin1-v2 }
      - name: Previous snapshot and day base from branch data-log (read-only; missing on the first run)
        run: |
          mkdir -p log
          git show origin/data-log:snapshot.json > log/prev-snapshot.json || rm -f log/prev-snapshot.json
          git show origin/data-log:day-base.json > log/prev-day-base.json || rm -f log/prev-day-base.json
      - id: data
        run: pnpm run data
        env: { PREV_SNAPSHOT: log/prev-snapshot.json }
        continue-on-error: true
      - if: steps.data.outcome == 'failure'
        run: |
          echo "::warning::Radio Browser build failed — deploying the last live dataset"
          pnpm run data:live
          curl -fsS --retry 2 https://cknyco.github.io/r1-skywave/data/new.json -o "$RUNNER_TEMP/new.json" \
            && mv "$RUNNER_TEMP/new.json" public/data/new.json || echo "no live new.json to keep"
      - if: steps.data.outcome == 'success'
        run: |
          pnpm run changelog --data public/data --prev log/prev-snapshot.json --day-base log/prev-day-base.json \
            --log log --date "$(date -u +%F)"
      - run: pnpm run build
      - run: pnpm test
      # The white check (header): fresh data only; the live fallback is the dataset already deployed.
      - if: steps.data.outcome == 'success'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - id: browser
        if: steps.data.outcome == 'success'
        run: pnpm exec playwright install --with-deps chromium
        continue-on-error: true
      - id: white
        name: White check (e2e/white.spec.ts on the fresh data)
        if: steps.browser.outcome == 'success'
        run: pnpm run white-check
        timeout-minutes: 15
        continue-on-error: true
      - if: steps.browser.outcome == 'failure' || (steps.white.outcome == 'failure' && !steps.white.outputs.verdict)
        run: echo "::warning::The white check could not run (browser install or the check itself failed) — deploying the fresh data unchecked"
      - name: White on the fresh data — deploy the last live dataset instead
        if: steps.white.outputs.verdict == 'white'
        env: { VIEWS: '${{ steps.white.outputs.views }}' }
        run: |
          echo "::warning::White on the fresh data ($VIEWS) — deploying the last live dataset; data-log is not updated tonight"
          rm -rf public/data
          pnpm run data:live
          curl -fsS --retry 2 https://cknyco.github.io/r1-skywave/data/new.json -o "$RUNNER_TEMP/new.json" \
            && mv "$RUNNER_TEMP/new.json" public/data/new.json || echo "no live new.json to keep"
          pnpm run build
          pnpm test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
      - if: steps.data.outcome == 'success' && steps.white.outputs.verdict != 'white'
        uses: actions/upload-artifact@v7
        with: { name: data-log, path: log, include-hidden-files: false, retention-days: 3 }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v5

  changelog:
    needs: build
    if: needs.build.outputs.fresh == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with: { name: data-log, path: log }
      - name: Commit the change log to branch data-log
        env:
          LOG: log
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          log=$(cd "$LOG" && pwd)
          date=$(jq -r .date "$log/changes/latest.json")
          baseline=$(jq -r .baseline "$log/changes/latest.json")
          if ! [[ "$date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "::error::unexpected date in latest.json"; exit 1; fi
          git init -q -b data-log datalog
          cd datalog
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "$REMOTE"
          set +e; git ls-remote --exit-code --heads origin data-log > /dev/null; found=$?; set -e
          if [ "$found" -eq 0 ]; then
            git fetch -q --depth=1 origin data-log
            git checkout -q -B data-log FETCH_HEAD
            # A v1 snapshot (before Task 8c) is replaced once by the format-upgrade baseline (Ruling 42), a snapshot
            # of older rules (none: 1) once by the data-upgrade baseline (Ruling 51).
            if [ "$baseline" = true ] && [ -f snapshot.json ] && [ "$(jq -r .v snapshot.json)" != 1 ] \
              && [ "$(jq -r '.rules // 1' snapshot.json)" -ge "$(jq -r '.rules // 1' "$log/snapshot.json")" ] \
              && [ "$(jq -r .baseline snapshot.json)" != "$(jq -r .baseline "$log/snapshot.json")" ]; then
              echo "::error::the build started a new baseline (previous snapshot missing or unreadable), but data-log already has one; not replacing it"
              exit 1
            fi
          elif [ "$found" -ne 2 ]; then
            echo "::error::git ls-remote failed (exit $found)"
            exit "$found"
          fi
          # Exit 2: no branch yet, this run creates it. The README is rewritten on every run so it follows the format.
          cat > README.md <<'EOF'
          # data-log

          Written by the `pages` workflow after each build with fresh station data; never merged into `main`.

          - `snapshot.json`: every station in the deployed dataset, keyed by Radio Browser uuid, with name, place, country, the date it was first seen and a short hash of its stream URL; `rules` is the version of the rules the dataset was built by, and a change starts a new baseline.
          - `day-base.json`: the last snapshot of the previous UTC day.
          - `changes/YYYY-MM-DD.md`: stations added, removed and changed (the same stream under a new uuid: renamed, moved or re-listed) since the end of the previous day. Later runs on the same day replace it; a day whose changes cancel out has none.
          - `changes/latest.json`: the counts behind the latest day file.

          The build job reads `snapshot.json` to keep each stream on the listing it had before and to publish `data/new.json`, the stations first seen in the last 14 days.
          Station names come from Radio Browser; the Markdown logs escape them.
          EOF
          mkdir -p changes
          cp "$log/snapshot.json" snapshot.json
          if [ -f "$log/day-base.json" ]; then cp "$log/day-base.json" day-base.json; fi
          rm -f "changes/$date.md"
          cp "$log"/changes/* changes/
          git add -A
          if [ -z "$(git status --porcelain)" ]; then echo "data-log: no changes"; exit 0; fi
          git commit -q -m "data: station changes $date"
          git push -q origin data-log
          echo "data-log: committed station changes $date"
