# Runs on every push (any branch) and on every pull request: typecheck, build the app against the
# live dataset already published on our own Pages site (never Radio Browser — a CI run must not
# depend on that service or count against it), the Vitest unit suite, and the full Playwright e2e
# suite (including the CPU-throttled wheel-walk check in e2e/throttle.spec.ts) against headless
# Chromium. It only verifies the tree; it never deploys anything. Deployment is pages.yml, which
# runs separately on pushes to main.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run data:live
      - run: npm run build
      - run: npm test
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=list,html
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          retention-days: 7
