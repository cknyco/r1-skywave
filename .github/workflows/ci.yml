# Runs on every push (any branch) and on every pull request: typecheck, build the app against the
# live dataset already published on our own Pages site (never Radio Browser — a CI run must not
# depend on that service or count against it), the Vitest unit suite, and the full Playwright e2e
# suite (including the CPU-throttled wheel-walk check in e2e/throttle.spec.ts and the white check
# e2e/white.spec.ts, which pages.yml also runs alone on fresh data before deploying it) against
# headless Chromium. It only verifies the tree; it never deploys anything. Deployment is pages.yml,
# which runs separately on pushes to main.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm only (package.json devEngines): the version that wrote pnpm-lock.yaml and reads allowBuilds.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (third-party: pinned to a commit)
        with: { version: 11.5.2 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run data:live
      - run: pnpm run build
      - run: pnpm test
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test --reporter=list,html
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results
          retention-days: 7
